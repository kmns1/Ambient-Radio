<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambient Radio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="dark"></div>
    <div class="radio">
        <div class="container">
            <div class="select">
                <p id="time">00:00</p>
                <div class="soundSet">
                        <div class="inner">
                            <button class="soundSetBtn" id="none"><i class="fa-solid fa-xmark"></i></button>
                            <button class="soundSetBtn" ><i class="fa-solid fa-cloud-rain"></i></button>
                            <button class="soundSetBtn" ><i class="fa-solid fa-bolt-lightning"></i></button>
                            <button class="soundSetBtn" ><i class="fa-solid fa-music"></i></button>
                            <button class="soundSetBtn" ><i class="fa-solid fa-wind"></i></button>
                            <button class="soundSetBtn" ><i class="fa-solid fa-fire"></i></button>
                            <button class="soundSetBtn" ><i class="fa-solid fa-people-group"></i></button>
                        </div>
                </div>
            </div>
            <div class="setting">
                <button class="soundBtn" id="soundBtn1"><i class="fa-solid fa-xmark"></i></button>
                <button class="soundBtn" id="soundBtn2"><i class="fa-solid fa-xmark"></i></button>
                <button class="soundBtn". id="soundBtn3"><i class="fa-solid fa-xmark"></i></button>
                <div class="volumeSet">
                    <div class="volumeObj"></div>
                </div>
                <div class="volumeSet">
                    <div class="volumeObj"></div>
                </div>
                <div class="volumeSet">
                    <div class="volumeObj"></div>
                </div>
            </div>
        </div>
    </div>
    <div class="background">
        <div class="table"></div>
    </div>
    <script src="script.js"></script>
</body>

</html>
